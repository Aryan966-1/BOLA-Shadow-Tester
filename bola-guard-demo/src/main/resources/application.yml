spring:
  application:
    name: bola-guard-demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bola_guard}
    username: ${DB_USERNAME:bola}
    password: ${DB_PASSWORD:bola}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  profiles:
    active: demo-secure

bola-guard:
  enabled: true
  ci:
    fail-on-bola: true
