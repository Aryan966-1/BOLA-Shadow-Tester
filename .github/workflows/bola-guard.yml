name: BOLA-Guard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Run Secure Tests
      run: mvn test -Dspring.profiles.active=demo-secure
      
    - name: Run Vulnerable Tests (Will Fail)
      run: |
        echo "Running tests in vulnerable mode. Expecting failure."
        mvn test -Dspring.profiles.active=demo-vulnerable && exit 1 || echo "Build correctly failed on BOLA."
